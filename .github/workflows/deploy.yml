name: 🚀 デプロイ - 本番環境へのリリース

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    name: 🚀 本番環境へのデプロイ
    runs-on: ubuntu-latest

    steps:
    - name: 📥 コードをチェックアウト
      uses: actions/checkout@v4

    - name: 📦 Node.js 20.x をセットアップ
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'mcp-customer-server/package-lock.json'

    - name: 📚 依存パッケージをインストール
      run: |
        cd mcp-customer-server
        npm ci

    - name: 🧪 テストを実行
      run: |
        cd mcp-customer-server
        npm test -- --coverage --watchAll=false

    - name: 📝 バージョン情報を取得
      id: version
      run: |
        VERSION=$(cat mcp-customer-server/package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 バージョン: $VERSION"

    - name: 📋 リリースノートを生成
      run: |
        echo "## 🎉 リリース v${{ steps.version.outputs.version }}" > release-notes.md
        echo "" >> release-notes.md
        echo "### ✨ 機能" >> release-notes.md
        echo "- MCPサーバー（17ツール）" >> release-notes.md
        echo "- Web ダッシュボード（強化版）" >> release-notes.md
        echo "- リアルタイムアラート機能" >> release-notes.md
        echo "- PDF/JSON エクスポート" >> release-notes.md
        echo "" >> release-notes.md
        echo "### 🧪 テスト" >> release-notes.md
        echo "- ✅ 23個のユニットテスト実行" >> release-notes.md
        echo "- ✅ 100% ステートメントカバレッジ" >> release-notes.md
        echo "" >> release-notes.md
        echo "### 📅 リリース日" >> release-notes.md
        echo "$(date '+%Y-%m-%d %H:%M:%S')" >> release-notes.md

    - name: 📤 リリースを作成
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: Release v${{ steps.version.outputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: false

    - name: ✅ デプロイ完了
      run: |
        echo "🎉 本番環境へのデプロイが完了しました"
        echo "📦 バージョン: v${{ steps.version.outputs.version }}"
        echo "🔗 GitHub: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"
