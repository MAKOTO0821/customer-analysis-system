<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム売上ダッシュボード（強化版）</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            color: white;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 2.5em;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: white;
            color: #667eea;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .connection-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .connection-status.connected {
            background: #4caf50;
            color: white;
        }
        .alerts-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .alerts-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }
        .alert-item {
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-item.success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }
        .alert-item.warning {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            color: #e65100;
        }
        .alert-item.info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1565c0;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .card-title {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .card-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
        }
        .card-subtitle {
            font-size: 0.85em;
            color: #999;
        }
        .card.success {
            border-left: 4px solid #4caf50;
        }
        .card.info {
            border-left: 4px solid #2196f3;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .chart-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .bar {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .bar-label {
            width: 150px;
            font-size: 0.9em;
            color: #666;
            font-weight: 600;
        }
        .bar-container {
            flex: 1;
            height: 25px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin: 0 15px;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }
        .bar-value {
            width: 120px;
            text-align: right;
            font-weight: 600;
            color: #333;
        }
        .pulse {
            animation: pulse 0.5s ease;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .update-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 リアルタイム売上ダッシュボード（強化版）</h1>
                <p style="margin-top: 10px; opacity: 0.9;">WebSocket でリアルタイム更新 • <span id="connection-status" class="connection-status">接続中...</span></p>
            </div>
            <div class="header-buttons">
                <button class="btn btn-primary" onclick="downloadReport()">📊 レポート</button>
                <button class="btn btn-primary" onclick="exportPDF()">📄 PDF</button>
            </div>
        </div>

        <div class="alerts-section" id="alerts-container">
            <div class="alerts-title">🔔 リアルタイムアラート</div>
            <div id="alerts-list"></div>
        </div>

        <div class="dashboard">
            <div class="card success">
                <div class="card-title">💰 総売上 <span class="update-indicator"></span></div>
                <div class="card-value" id="total-sales">¥0</div>
                <div class="card-subtitle">リアルタイム更新</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
                </div>
                <div style="font-size: 0.8em; color: #999; margin-top: 8px;" id="achievement-rate">目標達成度: 0%</div>
            </div>

            <div class="card info">
                <div class="card-title">📊 売上記録数</div>
                <div class="card-value" id="sales-count">0</div>
                <div class="card-subtitle">件数</div>
            </div>

            <div class="card success">
                <div class="card-title">👥 顧客数</div>
                <div class="card-value" id="customer-count">0</div>
                <div class="card-subtitle">社</div>
            </div>

            <div class="card info">
                <div class="card-title">👨‍💼 スタッフ数</div>
                <div class="card-value" id="staff-count">0</div>
                <div class="card-subtitle">人</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">🏆 スタッフ別パフォーマンス</div>
            <div id="staff-performance"></div>
        </div>

        <div class="chart-container">
            <div class="chart-title">💼 顧客別売上</div>
            <div id="customer-sales"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentData = {};

        socket.on('connect', () => {
            console.log('✅ サーバーに接続されました');
            document.getElementById('connection-status').textContent = '接続中';
            document.getElementById('connection-status').className = 'connection-status connected';
        });

        socket.on('disconnect', () => {
            console.log('❌ サーバーから切断されました');
        });

        socket.on('initial-data', (data) => {
            console.log('📥 初期データを受信', data);
            currentData = data;
            updateDashboard(data);
        });

        socket.on('data-update', (data) => {
            console.log('🔄 データ更新', data);
            currentData = { ...currentData, ...data };
            updateDashboard(currentData);
        });

        function updateDashboard(data) {
            if (data.statistics) {
                updateCard('total-sales', '¥' + data.statistics.total_sales_amount.toLocaleString('ja-JP'));
                updateCard('sales-count', data.statistics.total_sales_records);
                updateCard('customer-count', data.statistics.total_customers);
                updateCard('staff-count', data.statistics.unique_staff);

                // 目標達成度バーを更新
                const achievementRate = data.statistics.achievement_rate;
                document.getElementById('progress-bar').style.width = Math.min(achievementRate, 100) + '%';
                document.getElementById('achievement-rate').textContent = `目標達成度: ${achievementRate}%`;
            }

            if (data.alerts) {
                renderAlerts(data.alerts);
            }

            if (data.staff_performance) {
                renderStaffPerformance(data.staff_performance);
            }

            if (data.customer_sales) {
                renderCustomerSales(data.customer_sales);
            }
        }

        function updateCard(elementId, value) {
            const element = document.getElementById(elementId);
            element.classList.add('pulse');
            element.textContent = value;
            setTimeout(() => element.classList.remove('pulse'), 500);
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alerts-list');
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '<p style="color: #999;">アラートはありません</p>';
                return;
            }

            let html = '';
            alerts.forEach(alert => {
                html += `<div class="alert-item ${alert.level}">${alert.message} <span style="font-size: 0.8em; margin-left: auto;">${alert.timestamp}</span></div>`;
            });
            container.innerHTML = html;
        }

        function renderStaffPerformance(staffData) {
            const container = document.getElementById('staff-performance');
            if (!staffData || staffData.length === 0) {
                container.innerHTML = '<p style="color: #999;">データ更新中...</p>';
                return;
            }

            const maxSales = Math.max(...staffData.map(s => s.total_sales));
            let html = '';
            staffData.forEach((staff, index) => {
                const percentage = (staff.total_sales / maxSales) * 100;
                html += `
                    <div class="bar">
                        <div class="bar-label">${index + 1}. ${staff.staff}</div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${percentage}%"></div>
                        </div>
                        <div class="bar-value">¥${staff.total_sales.toLocaleString('ja-JP')}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderCustomerSales(customerData) {
            const container = document.getElementById('customer-sales');
            if (!customerData || customerData.length === 0) {
                container.innerHTML = '<p style="color: #999;">データ更新中...</p>';
                return;
            }

            const maxSales = Math.max(...customerData.map(c => c.total_sales));
            let html = '';
            customerData.forEach((customer) => {
                const percentage = (customer.total_sales / maxSales) * 100;
                html += `
                    <div class="bar">
                        <div class="bar-label">${customer.customer}</div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${percentage}%"></div>
                        </div>
                        <div class="bar-value">¥${customer.total_sales.toLocaleString('ja-JP')}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function downloadReport() {
            fetch('/api/report/daily')
                .then(res => res.json())
                .then(data => {
                    const json = JSON.stringify(data, null, 2);
                    const blob = new Blob([json], { type: 'application/json' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `report-${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    alert('✅ レポートをダウンロードしました');
                });
        }

        function exportPDF() {
            window.location.href = '/api/export/pdf';
            alert('📄 PDF をダウンロード中...');
        }
    </script>
</body>
</html>
